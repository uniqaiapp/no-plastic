name: tests
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  python:
    runs-on: ubuntu-latest
    strategy: { matrix: { python: ["3.9", "3.12"] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: python3 tests/run.py
      - run: python3 scripts/lint_prompt.py --strict --min-score 85 examples/*/after.txt
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test "$(du -sk . | cut -f1)" -lt 3072   # repo under 3 MB, .git included
